services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fintraderhub_api_prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: fintraderhub_postgres_prod
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fintraderhub_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fintraderhub_celery_worker_prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A infrastructure.tasks.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A infrastructure.tasks.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 40s

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fintraderhub_celery_beat_prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A infrastructure.tasks.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "test -f celerybeat-schedule || test -f celerybeat-schedule.db"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
